name: Task 28 checks

on:
  pull_request:
    branches: [main]
  push:
    branches: ["task28/**"]

permissions:
  contents: read

concurrency:
  group: task28-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require application source and lockfile
        run: |
          test -f package.json || { echo 'BLOCKED: package.json is missing; import the reviewed RentPay application source.'; exit 1; }
          test -f package-lock.json || { echo 'BLOCKED: package-lock.json is missing; generate and review the dependency lockfile.'; exit 1; }
          node -e "const p=require('./package.json'); if(!p.scripts?.test || !p.scripts?.build) process.exit(1)" || { echo 'BLOCKED: test/build scripts are required.'; exit 1; }
      - name: Install locked dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Production build
        run: npm run build
